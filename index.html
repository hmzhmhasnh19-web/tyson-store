<script>
        function selectService(serviceName) {
            document.getElementById('serviceType').value = serviceName;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            calculatePrice();
        }

        function calculatePrice() {
            let qty = document.getElementById('quantity').value;
            let service = document.getElementById('serviceType').value;
            let display = document.getElementById('totalPriceDisplay');

            if (service.includes('مشاهدات') && qty > 0) {
                let total = (qty / 100) * 0.40;
                display.innerText = "الإجمالي المتوقع: " + total.toFixed(2) + "$";
            } else if (service.includes('متابعين')) {
                display.innerText = "الإجمالي المتوقع: بحسب الاتفاق والكمية";
            } else {
                display.innerText = "الإجمالي المتوقع: 0.00$";
            }
        }

        async function sendOrderToDiscord() {
            const service = document.getElementById('serviceType').value;
            const link = document.getElementById('kickLink').value;
            const qty = document.getElementById('quantity').value;
            const duration = document.getElementById('streamDuration').value;
            const interaction = document.getElementById('interactionType').value;
            const priceText = document.getElementById('totalPriceDisplay').innerText;

            if (service.includes('اختر خدمة') || !link || !qty) {
                alert('الرجاء اختيار الخدمة، وإدخال رابط القناة والكمية بشكل صحيح!');
                return;
            }

            const orderData = {
                channel_name: link,
                service_type: service,
                quantity: parseInt(qty),
                duration: duration,
                interaction: interaction,
                total_price: priceText
            };

            try {
                // إرسال الطلب إلى سيرفر الـ Python الخاص بك (محلياً حالياً)
                let response = await fetch('http://localhost:8000/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                let data = await response.json();

                if (response.ok) {
                    alert('✅ ' + data.message);
                    document.getElementById('kickLink').value = '';
                    document.getElementById('quantity').value = '';
                    document.getElementById('serviceType').value = 'اختر خدمة من الأعلى أولاً';
                    document.getElementById('totalPriceDisplay').innerText = 'الإجمالي المتوقع: 0.00$';
                } else {
                    alert('❌ حدث خطأ أثناء إرسال الطلب للسيرفر.');
                }
            } catch (error) {
                console.error(error);
                alert('❌ تعذر الاتصال بالسيرفر المحلي، تأكد أن ملف server.py شغال!');
            }
        }
    </script>
